name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Package site
        run: tar -czf "my-api-console-${{ github.sha }}.tar.gz" -C dist .

      - name: Upload site package
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: my-api-console-${{ github.sha }}.tar.gz
          target: /tmp

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -eu

            DEPLOY_DIR="/var/www/my-api-console"
            STAGING_DIR="/var/www/my-api-console.staging-${{ github.sha }}"
            PREVIOUS_DIR="/var/www/my-api-console.previous"
            ARCHIVE="/tmp/my-api-console-${{ github.sha }}.tar.gz"

            test -f "$ARCHIVE"
            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"
            tar -xzf "$ARCHIVE" -C "$STAGING_DIR"
            test -f "$STAGING_DIR/index.html"

            rm -rf "$PREVIOUS_DIR"
            if [ -d "$DEPLOY_DIR" ]; then
              mv "$DEPLOY_DIR" "$PREVIOUS_DIR"
            fi
            mv "$STAGING_DIR" "$DEPLOY_DIR"

            if ! curl \
              --fail \
              --silent \
              --show-error \
              --header "Host: ismyh.cn" \
              "http://127.0.0.1/" >/dev/null; then
              rm -rf "$DEPLOY_DIR"
              if [ -d "$PREVIOUS_DIR" ]; then
                mv "$PREVIOUS_DIR" "$DEPLOY_DIR"
              fi
              exit 1
            fi

            rm -rf "$PREVIOUS_DIR"
            rm -f "$ARCHIVE"
