name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: crpi-3xux8vqn35fw00z9.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_NAME: project_hub/my-api-console
  CONTAINER_NAME: my-api-console

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER="${{ env.CONTAINER_NAME }}"
            NGINX_CONF="/opt/my-api-console/nginx.conf"

            test -f "$NGINX_CONF"
            echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login "${{ env.REGISTRY }}" --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" --password-stdin
            docker pull "$IMAGE"
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              --add-host=host.docker.internal:host-gateway \
              -v "$NGINX_CONF:/etc/nginx/conf.d/default.conf:ro" \
              "$IMAGE"

            sleep 3
            curl --fail --silent --show-error "http://127.0.0.1/" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1/api/v1/models/get?page=1&page_size=1" >/dev/null
